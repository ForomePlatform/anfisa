- group: Inheritance
  comment: |
      Variables based on inheritance properties of the case
  attributes:
  - attribute: Variant_in
    title: Variant presence in cohorts
    type: multiset
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    comment: |
      This annotation is only used when "cohort mode" is enabled. Cohort
      mode means that the case includes multiple (usually hundreds) of patients
      belonging to different cohorts corresponding to their phenotype.

      A list of cohorts, where this variant is present among patients.
    requires:
    - COHORTS
  - attribute: Callers
    title: Called by
    type: multiset
    knowledge_domain: call
    scale: variant
    purpose: provenance
    comment: |
      A list of variant callers that have called this variant
  - attribute: Inheritance_Mode
    title: Inheritance Mode
    type: func
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    comment: |
      Presumed inheritance mode, one of:
       * Homozygous recessive
       * Autosomal dominant
       * X-linked
       * Recessive / Compound heterozygous
  - attribute: Custom_Inheritance_Mode
    title: Custom Inheritance Mode
    type: func
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
  - attribute: Compound_Het
    title: Calculated Compound
    type: func
    knowledge_domain: phenotype
    scale: gene
    purpose: phenotype
  - attribute: Compound_Request
    title: Calculated Compound Request
    type: func
    knowledge_domain: phenotype
    scale: gene
    purpose: phenotype
  - attribute: Proband_Zygosity
    title: Proband Zygosity
    type: status
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    requires:
    - PROBAND
    default: 'False'
  - attribute: Num_Samples
    title: Number of Samples
    type: int
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    description: Number of samples in the case for which this variant has been called
    default: '0'
  - attribute: Has_Variant
    type: multiset
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
- group: Cohorts
  attributes:
  - attribute: ALL_AF
    title: AD for all cohorts
    type: float
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    comment: |
      This annotation is only used when "cohort mode" is enabled. Cohort
      mode means that the case includes multiple (usually hundreds) of patients
      belonging to different cohorts corresponding to their phenotype.

      This annotation contains allele frequency of a certain allele among all
      patients in all cohorts
    requires:
    - COHORTS
    default: '0'
  - attribute: ALL_AF2
    title: AF Hom for all cohorts
    type: float
    knowledge_domain: phenotype
    scale: variant
    purpose: phenotype
    comment: |
      This annotation is only used when "cohort mode" is enabled. Cohort
      mode means that the case includes multiple (usually hundreds) of patients
      belonging to different cohorts corresponding to their phenotype.

      This annotation contains frequency of a certain allele seen in the homozygous
      state among all patients in all cohorts
    description: Frequency of the allele in homozygous state for all cohorts
    requires:
    - COHORTS
    default: '0'
  - attribute: Cohort_{}_AF
    alt-names:
    - "{}_AF"
    template-base: cohort
    type: float
    knowledge_domain: phenotype
    scale: variant
  - attribute: Cohort_{}_AF2
    alt-names:
    - "{}_AF2"
    template-base: cohort
    title: AF Hom for cohort {}
    type: float
    knowledge_domain: phenotype
    scale: variant
- group: Variant
  attributes:
  - attribute: Variant_Class
    type: status
    knowledge_domain: function
    scale: transcript
    method: bioinf
    purpose: evidence
    description: Variant class as returned by VEP. The class of a variant is based
      on Sequence Ontology and is called according to its component alleles and its
      mapping to the reference genome. https://useast.ensembl.org/info/genome/variation/prediction/classification.html#classes
    default: 'False'
  - attribute: Most_Severe_Consequence
    type: status
    knowledge_domain: function
    scale: variant
    method: bioinf
    purpose: evidence
    description: |
      Most Severe Consequences from the transcript with the worst annotation.
       The set of consequence terms is
       defined by the Sequence Ontology (SO) http://www.sequenceontology.org/.
       See https://m.ensembl.org/info/genome/variation/prediction/predicted_data.html
       for details.
    default: undefined
    variants: Most_Severe_Consequence
  - attribute: Canonical_Annotation
    type: multiset
    knowledge_domain: function
    scale: variant
    method: bioinf
    purpose: evidence
    description: |
      Most Severe Consequences from canonical transcripts.
       The set of consequence terms is
       defined by the Sequence Ontology (SO) http://www.sequenceontology.org/.
       See https://m.ensembl.org/info/genome/variation/prediction/predicted_data.html
       for details.
    default: undefined
  - attribute: Multiallelic
    title: Multi-allelic?
    type: status
    knowledge_domain: call
    scale: variant
    purpose: provenance
    comment: |
      Is this variant multi-allelic? I.e., has more than one alternative alleles
      been observed at the same site for samples included in the case?
    default: 'False'
  - attribute: Altered_VCF
    title: Has VCF been normalized?
    type: status
    knowledge_domain: call
    scale: variant
    purpose: provenance
    comment: |
      This annotation notes if the original VCF record for this variant had to be
      modified in order to be normalized
    default: 'False'
  - attribute: Number_ALTs
    title: Number of Alternative alleles
    type: int
    knowledge_domain: call
    scale: variant
    purpose: provenance
