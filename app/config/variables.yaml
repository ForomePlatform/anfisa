    default: Not Provided
  - attribute: Clinvar_conflicts
    title: ClinVar Conflicts
    type: status
    knowledge_domain: human
    scale: variant
    method: clinical
    purpose: evidence
    default: Criteria not Provided
  - attribute: Clinvar_acmg_guidelines
    type: multiset
    knowledge_domain: human
    scale: variant
    method: clinical
    purpose: evidence
    default: None
  - attribute: ClinVar_Significance_{}
    template-base: submitter
    alt-names:
        - "{}_Significance"
    title: Clinical Significance by {}
    type: status
    knowledge_domain: human
    scale: variant
    method: clinical
    default:  None
  - attribute: splice_altering
    title: Splice AI splice altering
    type: status
    knowledge_domain: human
    scale: variant
    method: bioinf
    purpose: evidence
    description: |
      From [SpliceAI GitHub](https://github.com/Illumina/SpliceAI):

      _Delta score of a variant, defined as the maximum of (DS_AG, DS_AL, DS_DG, DS_DL),
      ranges from 0 to 1 and can be interpreted as the probability of the variant being
      splice-altering. In the [paper](https://github.com/Illumina/SpliceAI),
      a detailed characterization is provided
      for 0.2 (high recall), 0.5 (recommended), and 0.8 (high precision) cutoffs._

      In Anifsa we assign the following values to `splice_altering` annotation:

      +-----------------------------------------------+------------------------------+
      | Condition                                     | splice_altering              |
      +-----------------------------------------------+------------------------------+
      | MAX (DS_AG, DS_AL, DS_DG, DS_DL) < 0.2        |  `unlikely`                  |
      | 0.2 <= MAX (DS_AG, DS_AL, DS_DG, DS_DL) < 0.5 |  `likely_pathogenic`         |
      | 0.5 <= MAX (DS_AG, DS_AL, DS_DG, DS_DL) < 0.8 |  `pathogenic`                |
      | 0.8 <= MAX (DS_AG, DS_AL, DS_DG, DS_DL)       |  `high_precision_pathogenic` |
      +-----------------------------------------------+------------------------------+

    default: No altering
  - attribute: splice_ai_dsmax
    title: Splice AI splice altering score
    type: float
    knowledge_domain: human
    scale: variant
    method: bioinf
    purpose: evidence
    default: '0'
    render-mode: linear,>
  - attribute: Polyphen_2_HVAR
    title: Polyphen
    type: multiset
    knowledge_domain: human
    scale: transcript
    method: bioinf
    purpose: evidence
    description: HumVar (HVAR) is PolyPhen-2 classifier trained on known human variation
      (disease mutations vs. common neutral variants)
    default: N/A
  - attribute: Polyphen_2_HDIV
    title: Polyphen HDIV (High sensitivity)
    type: multiset
    knowledge_domain: human
    scale: transcript
    method: bioinf
    purpose: evidence
    description: HumDiv (HDIV) classifier is trained on a smaller number of select
      extreme effect disease mutations vs. divergence with close homologs (e.g. primates),
      which is supposed to consist of mostly neutral mutations.
    default: N/A
  - attribute: SIFT
    type: multiset
    knowledge_domain: function
    scale: transcript
    method: bioinf
    purpose: evidence
    description: |
      Sorting Intolerant from Tolerant (SIFT) is an algorithm that predicts the
      potential impact of amino acid substitutions on protein function.

      SIFT uses sequence homology to compute the likelihood that an amino acid
      substitution will have an adverse effect on protein function. The underlying
      assumption is that evolutionarily conserved regions tend to be less tolerant
      f mutations, and hence amino acid substitutions or insertions/deletions
      in these regions are more likely to affect function.

      Values:

       * D: Deleterious
       * T: Tolerated
    reference: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3394338/
    default: N/A
  - attribute: FATHMM
    type: multiset
    knowledge_domain: function
    scale: transcript
    method: bioinf
    purpose: evidence
    description: 'Functional analysis through hidden markov model HMM.D: Deleterious;
      T: Tolerated'
    default: N/A
  - attribute: PrimateAI
    type: multiset
    knowledge_domain: animal
    scale: variant
    method: bioinf
    purpose: evidence
    description: Prediction of PrimateAI score based on the authors recommendation,
      “T(olerated)” or “D(amaging)”. The score cutoff between “D” and “T” is 0.803.
    default: N/A
  - attribute: GERP_score
    title: GERP Score
    type: float
    knowledge_domain: animal
    scale: position
    method: bioinf
    purpose: evidence
    description: |
      Genomic Evolutionary Rate Profiling (GERP) score downloaded from
      [](http://mendel.stanford.edu/SidowLab/downloads/gerp/hg19.GERP_scores.tar.gz)

      The file contains two columns:

       1. Neutral evolution score (GERPN) score
       2. Rejected substitutions" (RS) score

      We only use RS scores.

      See [Project URL](http://mendel.stanford.edu/SidowLab/downloads/gerp/) for more information

      See [GERP Scores at UCSC](https://genome.ucsc.edu/cgi-bin/hgTrackUi?db=hg19&g=allHg19RS_BW)
    default: '0'
    render-mode: linear,>
