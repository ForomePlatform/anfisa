- group: Call_Quality
  attributes:
  - attribute: Proband_GQ
    title: Genotype Quality (GQ) for Proband
    type: float
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: GQ tells you how confident we are that the genotype we assigned to
      a particular sample is correct. It is simply the second lowest PL, because it
      is the difference between the second lowest PL and the lowest PL (always 0).
    requires:
    - PROBAND
    default: '-1'
    render-mode: linear,>
  - attribute: Min_GQ
    title: Minimum GQ for the family
    type: float
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: GQ tells you how confident we are that the genotype we assigned to
      a particular sample is correct. It is simply the second lowest PL, because it
      is the difference between the second lowest PL and the lowest PL (always 0).
    default: '-1'
    render-mode: linear,>
  - attribute: Max_GQ
    title: The highest GQ
    type: int
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: Max(GQ) for those samples that have the variant
    default: '0'
    render-mode: linear,=
  - attribute: Num_NO_CALL
    title: Number of NO_CALL samples
    type: int
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: Number of samples with NO_CALL in the current site
    default: '0'
    render-mode: linear,=
  - attribute: QUAL
    title: Variant Call Quality
    type: int
    knowledge_domain: call
    scale: variant
    purpose: provenance
    default: '-1'
  - attribute: QD
    title: Quality by Depth
    type: float
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: The QUAL score normalized by allele depth (AD) for a variant. This
      annotation puts the variant confidence QUAL score into perspective by normalizing
      for the amount of coverage available. Because each read contributes a little
      to the QUAL score, variants in regions with deep coverage can have artificially
      inflated QUAL scores, giving the impression that the call is supported by more
      evidence than it really is. To compensate for this, we normalize the variant
      confidence by depth, which gives us a more objective picture of how well supported
      the call is.
    default: '-1.0'
    render-mode: linear,>
  - attribute: FS
    title: Fisher Strand Bias
    type: float
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: Phred-scaled probability that there is strand bias at the site. Strand
      Bias tells us whether the alternate allele was seen more or less often on the
      forward or reverse strand than the reference allele. When there little to no
      strand bias at the site, the FS value will be close to 0.
    default: '0.0'
    render-mode: linear,<
  - attribute: FT
    title: FILTER
    type: multiset
    knowledge_domain: call
    scale: variant
    purpose: provenance
    description: This field contains the name(s) of any filter(s) that the variant
      fails to pass, or the value PASS if the variant passed all filters. If the FILTER
      value is ., then no filtering has been applied to the records.
