      Whether a variant falls in a "Masked-repeats" region (for tandem repeats).
      In FASTA files for an assembly repeat elements are usually written in lower case.
    reference: https://training.galaxyproject.org/training-material/topics/genome-annotation/tutorials/repeatmasker/tutorial.html
    default: 'No'
  - attribute: Transcript_dist_from_exon
