  - attribute: Region
    title: Region (All)
    type: status
    transcript-mode: true
    transcript-mode-flex:  true
    knowledge_domain: human
    scale: position
    purpose: evidence
    comment: |
      This annotation is calculated differently for small variants and for CNVs.

      For small variants it s a union of all regions in the transcripts, see @Transcript_region
      annotation. However, we also check if a
      variant falls in a "Masked-repeats" region (for tandem repeats). In FASTA files for
      an assembly repeat elements are usually written in lower case.  If a variant
      is in a masked region, we add "masked-repeats" to the list of regions.
    default: undefined
  - attribute: In_hg19
    alt-names:
    - hg19
    type: status
    knowledge_domain: human
    scale: position
    purpose: evidence
    default: Mapped
    value-map: In_hg19
