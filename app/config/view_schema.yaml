- aspect: view_qsamples
  title: Quality
  source: _view
  col-groups:
    columns:
    - column: quality_samples
  mode: dict
  view-kind: norm
  attrs:
  - attribute: title
    title: Title
  - attribute: qd
    title: Quality by Depth
    kind: numeric
    tooltip: The QUAL score normalized by allele depth (AD) for a variant. This annotation
      puts the variant confidence QUAL score into perspective by normalizing for the
      amount of coverage available. Because each read contributes a little to the
      QUAL score, variants in regions with deep coverage can have artificially inflated
      QUAL scores, giving the impression that the call is supported by more evidence
      than it really is. To compensate for this, we normalize the variant confidence
      by depth, which gives us a more objective picture of how well supported the
      call is.
  - attribute: mq
    title: Mapping Quality
    kind: numeric
    tooltip: This is the root mean square mapping quality over all the reads at the
      site. Instead of the average mapping quality of the site, this annotation gives
      the square root of the average of the squares of the mapping qualities at the
      site. When the mapping qualities are good at a site, the MQ will be around 60.
      Broad Institute recommendation is to fail any variant with an MQ value less
      than 40.0
  - attribute: variant_call_quality
    title: Variant Call Quality
    tooltip: QUAL tells you how confident we are that there is some kind of variation
      at a given site. The variation may be present in one or more samples.
  - attribute: strand_odds_ratio
    title: Strand Odds Ratio
    kind: numeric
    tooltip: Another way to estimate strand bias using a test similar to the symmetric
      odds ratio test. SOR was created because FS tends to penalize variants that
      occur at the ends of exons. Reads at the ends of exons tend to only be covered
      by reads in one direction and FS gives those variants a bad score. SOR will
      take into account the ratios of reads that cover both alleles.
  - attribute: fs
    title: Fisher Strand Bias
    kind: numeric
    tooltip: Phred-scaled probability that there is strand bias at the site. Strand
      Bias tells us whether the alternate allele was seen more or less often on the
      forward or reverse strand than the reference allele. When there little to no
      strand bias at the site, the FS value will be close to 0.
  - attribute: allelic_depth
    title: Allelic Depth
    tooltip: AD is the unfiltered allele depth, i.e. the number of reads that support
      each of the reported alleles. All reads at the position (including reads that
      did not pass the variant caller's filters) are included in this number, except
      reads that were considered uninformative. Reads are considered uninformative
      when they do not provide enough statistical evidence to support one allele over
      another.
  - attribute: read_depth
    title: Read Depth
    tooltip: DP - is a number of times that base pair locus was read
  - attribute: ft
    title: FILTERs
    kind: sequence
    tooltip: This field contains the name(s) of any filter(s) that the variant fails
      to pass, or the value PASS if the variant passed all filters. If the FILTER
      value is ., then no filtering has been applied to the records.
  - attribute: genotype_quality
    title: Genotype Quality
    tooltip: GQ tells you how confident we are that the genotype we assigned to a
      particular sample is correct. It is simply the second lowest PL, because it
      is the difference between the second lowest PL and the lowest PL (always 0).
  - attribute: genotype
    title: Sample Genotype
