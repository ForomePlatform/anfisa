    kind: sequence
  - attribute: polyphen
    title: Polyphen
    kind: sequence
    tooltip: https://brb.nci.nih.gov/seqtools/colexpanno.html#dbnsfp
  - attribute: polyphen2_hvar
    title: Polyphen 2 HVAR
    kind: sequence
    tooltip: HumVar (HVAR) is PolyPhen-2 classifier trained on known human variation
      (disease mutations vs. common neutral variants)
  - attribute: polyphen2_hdiv
    title: Polyphen 2 HDIV
    kind: sequence
    tooltip: HumDiv (HDIV) classifier is trained on a smaller number of select extreme
      effect disease mutations vs. divergence with close homologs (e.g. primates),
      which is supposed to consist of mostly neutral mutations.
  - attribute: sift
    title: SIFT from dbNSFP
    kind: sequence
    tooltip: 'Sort intolerated from tolerated (An amino acid at a position is tolerated
      | The most frequentest amino acid being tolerated). D: Deleterious T: tolerated'
  - attribute: sift_vep
    title: SIFT from VEP
    kind: sequence
  - attribute: revel
    title: REVEL
    kind: sequence
  - attribute: mutation_taster
    title: Mutation Taster
    kind: sequence
    tooltip: 'Bayes Classifier. A: (disease_causing_automatic); D: (disease_causing);
      N: (polymorphism [probably harmless]); P: (polymorphism_automatic[known to be
      harmless])'
  - attribute: mutation_assessor_predictions
    title: MutationAssessor
    kind: sequence
    tooltip: 'MutationAssessor functional impact of a variant : predicted functional,
      i.e. high (“H”) or medium (“M”), or predicted non-functional, i.e. low (“L”)
      or neutral (“N”). The MAori score cutoffs between “H” and “M”, “M” and “L”,
      and “L” and “N”, are 3.5, 1.935 and 0.8, respectively. The rankscore cutoffs
      between “H” and “M”, “M” and “L”, and “L” and “L”, are 0.92922, 0.51944 and
      0.19719, respectively.'
  - attribute: fathmm
    title: FATHMM
    kind: sequence
    tooltip: 'Functional analysis through hidden markov model HMM.D: Deleterious;
      T: Tolerated'
  - attribute: primate_ai_pred
    title: PrimateAI
    kind: sequence
    tooltip: Prediction of PrimateAI score based on the authors recommendation, “T(olerated)”
      or “D(amaging)”. The score cutoff between “D” and “T” is 0.803.
  - attribute: cadd_phred
    title: CADD (Phred)
    kind: sequence
    tooltip: CADD Combined annotation dependent depletion
  - attribute: cadd_raw
    title: CADD (Raw)
    kind: sequence
    tooltip: CADD Combined annotation dependent depletion
  - attribute: sift_score
    title: SIFT score
    kind: sequence
  - attribute: polyphen2_hvar_score
    title: Polyphen 2 HVAR score
    kind: sequence
  - attribute: polyphen2_hdiv_score
    title: Polyphen 2 HDIV score
    kind: sequence
  - attribute: mutation_assessor_scores
    title: MutationAssessor score (MAori)
    kind: sequence
    tooltip: MutationAssessor functional impact combined score (MAori). Multiple entries
      are separated by “;”, corresponding to Uniprot_entry.
  - attribute: dann_score
    title: DANN Functional Prediction score
    kind: sequence
    tooltip: DANN is a functional prediction score retrained based on the training
      data of CADD using deep neural network
